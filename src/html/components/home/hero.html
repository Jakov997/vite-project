<section class="hero hero-decor">
    <div class="container hero__container">
        <div class="hero__left">
            <h2 class="hero__title"> Digitally forward creative</h2>
            <p class="hero__subtitle text-p-subtitle">
                When it comes to interactive marketing, we've got you covered.
                Be where the world is going
            </p>
            <form class="hero__form">
                <input type="email" required class="hero__input" placeholder="Enter your email" />
                <button class="hero__btn button-form">Try for free</button>
            </form>
        </div>
        <div class="hero__right">
            <div class="hero__sales">
                <h3 class="hero__sales-title">Sales Report</h3>
                <img src="/svg/Month.svg" class="hero__sales-img" width="366" height="260" alt="Sales Report Graphic" />
            </div>
            <div class="hero__customer">
                <h3 class="hero__customer-title">Customer Growth</h3>
                <img src="/svg/Graph.svg" width="176" height="148" alt="Customer Report Graphic"
                    class="hero__customer-img" />
            </div>
            <table class="hero__statics">
                <thead>
                    <tr>
                        <th class="hero__statics-title">
                            Sales
                        </th>
                        <th class="hero__statics-title">
                            Customers
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th class="hero__statics-price">$31,092</th>
                        <th class="hero__statics-price">$29,128</th>
                    </tr>
                    <tr>
                        <th class="hero__statics-down">
                            <span class="green">4.2%</span>
                            <span>from last year</span>
                        </th>
                        <th class="hero__statics-down">
                            <span class="red">1.2%</span>
                            <span>from last year</span>
                        </th>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
